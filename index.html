    <script>
      // Restore the saved theme before first paint so dark mode does not flash.
      // Light is the default; the OS color scheme is intentionally ignored.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151714')
        }
      } catch (e) { /* localStorage unavailable */ }
    </script>
