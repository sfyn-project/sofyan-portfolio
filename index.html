<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sofyan Syahri Huzaini — Backend Developer with 7+ years of experience building production systems with PHP, Laravel, MySQL, REST APIs, GPS telemetry, and operational workflows." />
    <meta name="theme-color" content="#f4f1e9" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Sofyan Syahri Huzaini — Backend Developer</title>
    <script>
      // Restore the saved theme before first paint so dark mode does not flash.
      // Light is the default; the OS color scheme is intentionally ignored.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151714')
        }
      } catch (e) { /* localStorage unavailable */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
